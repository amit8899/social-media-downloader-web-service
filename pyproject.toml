[project]
name = "social-media-video-downloader"
version = "2.0.0"
description = "FastAPI + yt-dlp extraction server. Android downloads directly from extracted CDN URLs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.116.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
    "yt-dlp[default]>=2025.7.21",
]

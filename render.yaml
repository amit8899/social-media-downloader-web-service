services:
  - type: web
    name: social-media-downloader
    runtime: python
    plan: free                      # or starter
    region: oregon                  # or your preferred region

    buildCommand: >
      apt-get update &&
      apt-get install -y ffmpeg nodejs npm git &&
      pip install
      "yt-dlp[default]>=2025.7.21"
      "fastapi>=0.116.1"
      "uvicorn>=0.35.0"
      "python-dotenv>=1.1.1"
      "python-multipart>=0.0.20" &&
      rm -rf vendor/bgutil-ytdlp-pot-provider &&
      mkdir -p vendor &&
      git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git vendor/bgutil-ytdlp-pot-provider &&
      cd vendor/bgutil-ytdlp-pot-provider/server &&
      npm ci &&
      npx tsc

    startCommand: >
      sh -c 'cd vendor/bgutil-ytdlp-pot-provider/server &&
      node build/main.js --host 127.0.0.1 --port 4416 &
      cd /opt/render/project/src &&
      sleep 3 &&
      uvicorn main:app --host 0.0.0.0 --port $PORT'

    healthCheckPath: /health        # uses the cheap GET /health (does NOT call yt-dlp)

    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "10000"             # Render assigns this automatically — keep as placeholder
      - key: YOUTUBE_PO_API_TOKEN
        sync: false
      - key: BGUTIL_PROVIDER_URL
        value: "http://127.0.0.1:4416/get_pot"
